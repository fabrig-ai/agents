# The plan coordinator: `codex -p coordinator`, started in ~/src/rust
# (skein's docs/foundation/development.md, sections 2.3 and 7).
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
# Compact at about 200K tokens: in temper's protocol run the coordinator
# compacted only at 349K to 395K, and an hour at a mean of 347K cost 28.1M
# tokens against 7.5M after a compaction (its retrospective, proposal 4).
model_auto_compact_token_limit = 200000

[agents]
# Sub-agents running at once: the sessions a run holds open (section 7.2).
# A finished one frees its place (tested with Codex 0.160.1 and 0.162.1).
max_threads = 8

# The coordinator reads reports and git, and never reads code (section 2.3).
[mcp_servers.codebase-memory-mcp]
enabled = false
