# The plan coordinator: `codex -p coordinator`, started in ~/src/rust
# (skein's docs/foundation/development.md, sections 2.3 and 7).
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[agents]
# Sub-agent threads, finished ones included: Codex counts them and has no
# tool to close one. Room for a fresh thread at each handover (section
# 7.2); at most 8 sessions run at once.
max_threads = 24
