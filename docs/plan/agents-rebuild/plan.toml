# The thin cut for rebuilding the pipelines' code as fab (docs/design/fab.md).
draft = "agents-rebuild"
repo = "agents"
sources = [
  "docs/design/draft/code-producing-pipeline.md",
  "docs/design/draft/landing-pipeline.md",
  "docs/design/draft/execution-modes.md",
]

[buffer]
low = 1.0
high = 2.0

# Contracts: what more than one part reads. Each lands alone as a skeleton.

[[part]]
id = "package"
title = "Package, command, runner seam and the 30 s test runner"
mode = "feature"
needs = []
design = "docs/design/fab.md, 2 and 8"
done = true

[[part]]
id = "files"
title = "Event log, plan and task specs, the status fold"
mode = "feature"
needs = ["package"]
design = "docs/design/fab.md, 3 and 4"

[[part]]
id = "slot-contract"
title = "hosts.toml, slot claims, sweep and reclaim signatures, heavy's exit codes"
mode = "feature"
needs = ["package"]
design = "docs/design/fab.md, 7"
done = true

# Slice 1: an agents task runs and lands with fab.

[[part]]
id = "land"
title = "bin/fab land for this repository"
mode = "feature"
needs = ["files"]
design = "docs/design/fab.md, 6"

[[part]]
id = "run"
title = "Runs: prepare a worktree, compile the brief, start codex-run, read the outcome"
mode = "feature"
needs = ["files"]
design = "docs/design/fab.md, 5"

# Slice 2: fabrig lands through fab, and builds never stop for disk.

[[part]]
id = "slot-probe"
title = "Measure a slot's peak during a broad build, to set the slot bound"
mode = "probe"
needs = []
design = "docs/design/fab.md, 7"
done = true

[[part]]
id = "slots"
title = "Slot claim, release, sweep and reclaim on a builder"
mode = "feature"
needs = ["slot-contract", "slot-probe"]
design = "docs/design/fab.md, 7"

[[part]]
id = "heavy"
title = "Build admission: concurrency, the gate lane, the disk wait with reclaim"
mode = "migration"
needs = ["slots"]
design = "docs/design/fab.md, 7"

[[part]]
id = "codex"
title = "fab codex: Codex runs as user units, replacing codex-run"
mode = "migration"
needs = ["package"]
design = "docs/design/fab.md, 5"

[[part]]
id = "gate"
title = "fabrig's selection and check steps, shared by the queue and precheck"
mode = "migration"
needs = ["package"]
design = "docs/design/fab.md, 6"

[[part]]
id = "queue"
title = "fabrig's merge queue, ported from tools/queue/mq's core"
mode = "migration"
needs = ["files", "gate"]
design = "docs/design/fab.md, 6"

[[part]]
id = "precheck"
title = "Precheck in the implementer's slot, with the queue's selection"
mode = "migration"
needs = ["gate"]
design = "docs/design/fab.md, 6"

[[part]]
id = "cutover-landing"
title = "Install fab's heavy, queue and precheck; delete fabrig's tools/"
mode = "migration"
needs = ["heavy", "queue", "precheck"]
design = "docs/design/fab.md, 1"

# Slice 3: the dispatcher keeps the pipeline full unattended.

[[part]]
id = "dispatch"
title = "The dispatcher: decide's actions and the tick that takes them; questions park tasks"
mode = "feature"
needs = ["files", "run", "land"]
design = "docs/design/fab.md, 13"

[[part]]
id = "calls"
title = "Claude calls from compiled briefs: skeleton author, answerer"
mode = "feature"
needs = ["files"]
design = "docs/design/fab.md, 13"

# Slice 4: both pipelines report themselves.

[[part]]
id = "report"
title = "Standing reports for both drafts from the log and the queue's record"
mode = "feature"
needs = ["files", "queue"]
design = "docs/design/fab.md, 10"

[[part]]
id = "after-landing"
title = "after-landing and tiers, ported"
mode = "migration"
needs = ["heavy", "slots"]
design = "docs/design/fab.md, 11"

# Slice 5: quality on every branch, and nothing resident left.

[[part]]
id = "gates"
title = "Gates and the structure digest; the structure review call"
mode = "feature"
needs = ["calls"]
design = "docs/design/fab.md, 12"

[[part]]
id = "retire-kit"
title = "Retire session, watch's session rules, post, lease, record-collect and the old kit"
mode = "migration"
needs = ["dispatch", "report"]
design = "docs/design/fab.md, 14"

[[slice]]
id = 1
story = "A task spec in this repository becomes a Codex run on hetzner6 and lands on main through bin/fab land with its tests"
parts = ["package", "files", "land", "run"]
walk = true

[[slice]]
id = 2
story = "A fabrig branch lands through fab's queue; a build short of disk waits and resumes while idle slots are reclaimed"
parts = ["slot-contract", "slot-probe", "slots", "heavy", "codex", "gate", "queue", "precheck", "cutover-landing"]
walk = true

[[slice]]
id = 3
story = "Tasks of a plan run, park on questions and land with nobody dispatching by hand"
parts = ["dispatch", "calls"]
walk = true

[[slice]]
id = 4
story = "Both drafts' metrics are reported daily from records alone; slow tiers run after landing"
parts = ["report", "after-landing"]
walk = false

[[slice]]
id = 5
story = "Every branch passes the gates and a structure review; no resident session is needed"
parts = ["gates", "retire-kit"]
walk = false

# Slice 6: the full model, built by the loop itself (docs/design/fab.md, 13).

[[part]]
id = "call-review"
title = "A Codex review of every Claude call's output before it lands"
mode = "feature"
needs = ["calls", "dispatch"]
design = "docs/design/fab.md, 13.1"

[[part]]
id = "acceptance"
title = "Test-writer and accept runs: acceptance per part and per slice, apart from the implementers"
mode = "feature"
needs = ["run", "gates"]
design = "docs/design/fab.md, 13.1"

[[part]]
id = "plans"
title = "Every plan in one tick; skeleton calls in parallel"
mode = "feature"
needs = ["dispatch", "flow"]
design = "docs/design/fab.md, 13.4"

[[part]]
id = "critique"
title = "A self-critique run on every branch before it lands or is readied"
mode = "feature"
needs = ["gates", "run"]
design = "docs/design/fab.md, 13.1"

[[part]]
id = "foreman"
title = "A foreman run settles questions the task's options answer; the rest queue for the answerer"
mode = "feature"
needs = ["dispatch", "calls"]
design = "docs/design/fab.md, 13.1"

[[part]]
id = "foreman-repairs"
title = "The foreman writes rebase and repair tasks from a refusal, or retries a red that is not the branch's"
mode = "feature"
needs = ["foreman"]
design = "docs/design/fab.md, 13.1"

[[part]]
id = "landing-checks"
title = "The queue reuses precheck receipts and classes reds before anyone hears them"
mode = "feature"
needs = ["queue", "precheck"]
design = "docs/design/fab.md, 13.8"

[[part]]
id = "flow"
title = "A target for runs in flight that grows with clean landings; places as hints"
mode = "feature"
needs = ["dispatch"]
design = "docs/design/fab.md, 13.2"

[[part]]
id = "designer"
title = "The designer's calls: cut, contracts, decision, retire"
mode = "feature"
needs = ["calls"]
design = "docs/design/fab.md, 13.3"

[[part]]
id = "surveys"
title = "Survey runs at intake and before each skeleton call, their reports in the briefs"
mode = "feature"
needs = ["calls", "run"]
design = "docs/design/fab.md, 13.10"

[[part]]
id = "intake"
title = "fab draft start: the user starts a draft by hand, and it runs its surveys, then its cut"
mode = "feature"
needs = ["designer", "surveys", "events"]
design = "docs/design/fab.md, 13.10"

[[part]]
id = "buffer-order"
title = "Runnable tasks in the timeline's order: consolidations first, then repairs, contracts, slices"
mode = "feature"
needs = ["dispatch"]
design = "docs/design/fab.md, 13.10"

[[part]]
id = "rust-gates"
title = "Gates over Rust, minimal: files and the old-forms ratchet, size as a digest flag; the Rust digest"
mode = "feature"
needs = ["gates"]
design = "docs/design/fab.md, 12 and 13.11"

[[part]]
id = "events"
title = "Events start the tick, coalesced; the timer only a 10-minute backstop"
mode = "feature"
needs = ["dispatch", "codex"]
design = "docs/design/fab.md, 13.9"

[[part]]
id = "accounting"
title = "Codex tokens in the log; the Claude to Codex weight; calls measured against 600k"
mode = "feature"
needs = ["report", "calls"]
design = "docs/design/fab.md, 13.5"

[[part]]
id = "probe"
title = "Probe runs with a time box, and their decision calls"
mode = "feature"
needs = ["designer"]
design = "docs/design/fab.md, 13.7"

[[part]]
id = "user-channel"
title = "The user's questions and the daily reports on one page"
mode = "feature"
needs = ["report"]
design = "docs/design/fab.md, 13.6"

[[slice]]
id = 6
story = "A draft goes from its cut to landed code with design, acceptance and review by separate sessions, growing from two runs in flight to many"
parts = ["call-review", "acceptance", "critique", "foreman", "foreman-repairs", "flow", "designer", "plans", "accounting", "probe", "user-channel", "landing-checks", "events", "surveys", "intake", "buffer-order"]
walk = false

[[part]]
id = "fabrig-calls"
title = "A plan in fabrig: its calls, answers and repairs land through fabrig's queue; briefs in Rust"
mode = "feature"
needs = ["plans", "designer", "foreman-repairs"]
design = "docs/design/fab.md, 13.11"

[[part]]
id = "wide-start"
title = "Start wide and early: the target at places, optimistic starts from a checked skeleton, direct mode"
mode = "feature"
needs = ["flow", "call-review"]
design = "docs/design/fab.md, 13.11"

[[slice]]
id = 7
story = "A plan living in fabrig runs from its cut to landed Rust through fabrig's queue, gated minimally, starting wide, measured per part"
parts = ["fabrig-calls", "rust-gates", "wide-start", "accounting"]
walk = false
