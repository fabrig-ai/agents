landing = "queue"

# The thin cut of findings-repair: the repair path of QA findings in fab
# (docs/design/qa.md, 2, "Built in this order", "After red-routing's tick
# wiring lands"), on top of findings-loop's fold, triage and tick steps. Every
# part is direct; its task specs are in tasks/, the shared notes in notes/,
# the cut's decisions and its critical path in notes/decisions.md. Walks run
# by fab and "Then it holds" are not in this plan (the request).
draft = "findings-repair"
repo = "agents"
sources = [
  "docs/plan/findings-repair/inputs/request.md",
  "docs/design/draft/execution-modes.md",
]

[buffer]
low = 1.0
high = 2.0

# What the other parts read: Fix mode's shared steps, one copy for both kinds.

[[part]]
id = "fix"
title = "fab/fix.py: Fix mode's shared steps factored out of fab/tier_reds.py, red unchanged"
mode = "direct"
needs = []
design = "docs/design/qa.md, 2"

# Slice 1: red's path runs through the shared steps and the renamed pair.

[[part]]
id = "kinds"
title = "FIX_KINDS wherever the red wiring reads kind red, and the examine-fix/remedy-fix pair"
mode = "direct"
needs = ["fix"]
design = "docs/design/qa.md, 2; docs/design/after-landing.md, 2"

# Slice 2: a routed finding is repaired, or left as a signal.

[[part]]
id = "foreman"
title = "fab/fixes.py and the finding's foreman: its brief, its settlement and the finding-<n> repair task"
mode = "direct"
needs = ["fix"]
design = "docs/design/qa.md, 2"

[[part]]
id = "tick"
title = "The tick's finding steps: finding_actions, the repairs joined to the plan's tasks"
mode = "direct"
needs = ["foreman", "kinds"]
design = "docs/design/qa.md, 2; docs/design/tick.md, 6"

[[part]]
id = "signal"
title = "The finding-<n> signal on the user's page for a finding its foreman left"
mode = "direct"
needs = ["foreman"]
design = "docs/design/channel.md, 2; docs/design/qa.md, 2"

[[slice]]
id = 1
story = "An after-landing red runs its foreman, settlement and repair through fab/fix.py and the examine-fix/remedy-fix pair, its records and tests as before"
parts = ["fix", "kinds"]
walk = false

[[slice]]
id = 2
story = "A finding triaged to the path starts one foreman; its fix makes <draft>/finding-<n>, an implement run from main, readied and landed, after which the rung is due for a rerun; its retry leaves finding-<n> on the user's page and holds nothing"
parts = ["foreman", "tick", "signal"]
walk = true
