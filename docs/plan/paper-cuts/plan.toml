landing = "queue"

# The thin cut of paper-cuts: the three paper cuts the request lists, as
# designed in docs/design/calls.md 3 (retire's brief bounded) and
# docs/design/integration.md 4 (the overlap probe's cache and records,
# and a real-git test of it). Every part is direct; its task specs are in
# tasks/, the shared notes in notes/, the cut's decisions and its critical
# path in notes/decisions.md.
draft = "paper-cuts"
retired = true
repo = "agents"
sources = [
  "docs/plan/paper-cuts/inputs/request.md",
  "docs/design/draft/execution-modes.md",
]

[buffer]
low = 1.0
high = 2.0

# Slice 1: a retire brief stays within BRIEF_LIMIT.

[[part]]
id = "bounded-retire"
title = "Retire's brief bounded: each changed design as the shorter of its diff and its text, the rest listed"
mode = "direct"
needs = []
design = "docs/design/calls.md, 3"

# Slice 2: the overlap probe's cache and records, tried on real git.

[[part]]
id = "probe-cuts"
title = "The overlap probe's cache pruned, conflicts cached, written on change; malformed trunks.overlap records ignored"
mode = "direct"
needs = []
design = "docs/design/integration.md, 4"

[[part]]
id = "probe-git"
title = "A test of the overlap probe against real git"
mode = "direct"
needs = []
design = "docs/design/integration.md, 4"

[[slice]]
id = 1
story = "A plan whose changed designs would pass BRIEF_LIMIT whole gets a retire brief within it: each design as the shorter of its diff since the plan started and its text, the designs that do not fit listed for the call to read"
parts = ["bounded-retire"]
walk = false

[[slice]]
id = 2
story = "A tick with nothing moved runs no merge, not even a conflicting catch-up, and leaves overlaps.json unwritten; the file holds only this tick's keys; a malformed trunks.overlap neither stops a tick nor breaks the page; on real git the probe logs a conflicting path with a space and a bad tree is a failure"
parts = ["probe-cuts", "probe-git"]
walk = false
