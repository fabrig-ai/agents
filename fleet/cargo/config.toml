[build]
rustc-wrapper = "$HOME/.local/bin/kache"

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "force-frame-pointers=yes"]

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[net]
git-fetch-with-cli = true

# temper builds without the browser bundle unless TEMPER_BUNDLE=embed is set
[env]
TEMPER_BUNDLE = "none"
